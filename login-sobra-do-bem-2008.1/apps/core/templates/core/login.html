{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sobra do Bem</title>
    <link rel="shortcut icon" href="{% static 'images/cuiasdb.png' %}" type="image/x-icon">    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/sdbstyle.css' %}">
    <style>
        html, body { height: 100%; margin: 0; background-color: #E6f5f5; }
        .login-wrapper { height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-box { background-color: #fff; padding: 3rem; border-radius: 0.8rem; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 100%; max-width: 500px; }
        .login-box h1 { text-align: center; color: #674525; margin-bottom: 2rem; }
        .form-control { padding: 0.75rem 1rem; font-size: 1.1rem; border-radius: 0.4rem; transition: all 0.3s ease; }
        .form-control:focus { border-color: #e69a6e; box-shadow: 0 0 8px rgba(230, 154, 110, 0.3); }
        .btn-group-login { display: flex; gap: 1rem; width: 100%; margin-top: 1rem; }
        .btn-login, .btn-google { flex: 1; font-weight: bold; display: flex; align-items: center; justify-content: center; padding: 0.75rem; border-radius: 0.4rem; transition: all 0.3s ease; cursor: pointer; }
        .btn-login { background-color: #674525; color: #fff; }
        .btn-login:hover { background-color: #54391b; }
        .btn-google { background-color: #4285F4; color: #fff; text-decoration: none; }
        .btn-google:hover { background-color: #357ae8; transform: scale(1.05); text-decoration: none; }
        .login-box p { text-align: center; margin-top: 1.5rem; }
        @media(max-width: 576px){ .btn-group-login { flex-direction: column; } }
    </style>
</head>
<body>
    <!-- Barra de Navegação -->
    <nav class="navbar navbar-light bg-navbar">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'index' %}">
          <img src="{% static 'images/cuiasdb.png' %}" alt="" width="50" height="40" class="d-inline-block align-text-top">
          <p class="logo-text">Sobra do bem</p>     
        </a>
        <div class="head-btns">
            <a href="{% url 'cadastro' %}" class="btn btn2">Cadastrar</a>
            <a href="{% url 'login' %}" class="btn btn2">Entrar</a>
        </div>
      </div>
    </nav>

    <!-- Formulário de Login Centralizado -->
    <div class="login-wrapper">
        <div class="login-box">
            <h1>Entrar</h1>

            {% if messages %}
                <div class="mb-3">
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" class="d-flex flex-column gap-3">
                {% csrf_token %}
                <!-- Campo email obrigatório -->
                <input type="email" name="email" class="form-control" placeholder="E-mail" required>
                <input type="password" name="senha" class="form-control" placeholder="Senha" required>

                <div class="btn-group-login">
                    <button type="submit" class="btn btn-login">Entrar</button>
                    <a href="#" class="btn btn-google"><i class="fab fa-google"></i> Entrar com Google</a>
                </div>
            </form>

            <p>Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
