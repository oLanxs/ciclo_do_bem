{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobra do Bem</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'images/cuiasdb.png' %}" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Seu CSS -->
    <link rel="stylesheet" href="{% static 'css/sdbstyle.css' %}">
</head>
<body>

    <!-- Barra de Navegação -->
    <nav class="navbar bg-navbar py-3">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'index' %}">
                <img src="{% static 'images/cuiasdb.png' %}" alt="Logo" width="50" height="40" class="d-inline-block align-text-top">
                <p class="logo-text mb-0 ms-2">Sobra do Bem</p>
            </a>
            <div class="btns">
                <a href="{% url 'cadastro' %}" class="btn btn2">Cadastrar</a>
                <a href="{% url 'login' %}" class="btn btn2">Entrar</a>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="main-container">
        <div class="text-container">
            <h1 class="title-text">Transformando <span>sobras</span> em <span>solidariedade</span></h1>
            <p class="text">Conectamos estabelecimentos que têm sobra de alimentos com instituições que precisam. Juntos, reduzimos o desperdício e alimentamos a esperança.</p>
            <a href="#" class="btn btn2 w-25">Saiba Mais</a>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
